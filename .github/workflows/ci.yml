name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    name: 🧹 Hooks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-qt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run hooks
        env:
          QMLFORMAT: ${{ env.QT_ROOT_DIR }}/bin/qmlformat
        run: pipx run pre-commit run --all-files --show-diff-on-failure

      - name: Check commit messages
        if: github.actor != 'dependabot[bot]'
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="$BASE..$HEAD" ;;
            push) [[ "$BEFORE" =~ ^0+$ ]] && range="$HEAD^!" || range="$BEFORE..$HEAD" ;;
            *) range="$HEAD^!" ;;
          esac
          scripts/check-commit-range.sh "$range"

  lint:
    name: 🔎 Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-qt
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Lint
        run: scripts/lint.sh build

  build:
    name: Build
    needs: [hooks, lint]
    uses: ./.github/workflows/build.yml
    with:
      package: true

  wasm:
    name: Web
    needs: [hooks, lint]
    uses: ./.github/workflows/wasm.yml

  snapshots:
    name: 📸 Screenshots
    needs: [hooks, lint]
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-qt
      - name: Build snapshot tool
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target uiverse-snapshot --parallel
      - name: Render every style
        run: scripts/snapshots.sh build snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: snapshots
          if-no-files-found: error

  demo:
    name: 🚀 Deploy demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: wasm
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: uiverse-wasm
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
