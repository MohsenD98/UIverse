name: Desktop build

on:
  workflow_call:
    inputs:
      package:
        description: Install, deploy and package the app.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: windows-x64
            os: windows-2025
          - name: macos-arm64
            os: macos-15
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-qt

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUIVERSE_BUILD_TOOLS=${{ !inputs.package }}

      - name: Build
        run: cmake --build build --parallel

      - name: Install
        if: inputs.package
        run: cmake --install build --prefix dist

      - name: Package
        if: inputs.package
        id: package
        env:
          NAME: UIverse-${{ github.ref_name }}-${{ matrix.name }}
        run: |
          case "$RUNNER_OS" in
            Windows) 7z a -tzip "$NAME.zip" ./dist/*; file="$NAME.zip" ;;
            macOS)   hdiutil create -volname UIverse -srcfolder dist/appUIverse.app -ov -format UDZO "$NAME.dmg"; file="$NAME.dmg" ;;
            Linux)   tar -czf "$NAME.tar.gz" -C dist .; file="$NAME.tar.gz" ;;
          esac
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: inputs.package
        with:
          name: uiverse-${{ matrix.name }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error
