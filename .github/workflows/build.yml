name: Build

on:
  workflow_call:
    inputs:
      package:
        description: Install, deploy and package the app.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            label: 🐧 Linux
            os: ubuntu-24.04
          - name: windows-x64
            label: 🖥️ Windows
            os: windows-2025
          - name: macos-arm64
            label: 🍎 macOS
            os: macos-15
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-qt

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUIVERSE_BUILD_TOOLS=${{ !inputs.package }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        if: inputs.package
        run: |
          if ! cmake --install build --prefix "$GITHUB_WORKSPACE/dist" > install.log 2>&1; then
            cat install.log
            summary=$(tail -n 30 install.log | tr -d '\r' | sed -e 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }')
            echo "::error title=Install failed::$summary"
            exit 1
          fi

      - name: Package
        if: inputs.package
        id: package
        env:
          NAME: UIverse-${{ github.ref_name }}-${{ matrix.name }}
        run: |
          case "$RUNNER_OS" in
            Windows) 7z a -tzip "$NAME.zip" ./dist/*; file="$NAME.zip" ;;
            macOS)   hdiutil create -volname UIverse -srcfolder dist/appUIverse.app -ov -format UDZO "$NAME.dmg"; file="$NAME.dmg" ;;
            Linux)   tar -czf "$NAME.tar.gz" -C dist .; file="$NAME.tar.gz" ;;
          esac
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: inputs.package
        with:
          name: uiverse-${{ matrix.name }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error
